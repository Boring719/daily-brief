name: 每日国际简报

on:
  schedule:
    # GitHub 用的是 UTC：00:00 UTC = 北京时间 08:00
    - cron: "0 0 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-brief
  cancel-in-progress: false

jobs:
  brief:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 取代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: pip install lxml

      - name: 取回历史存档
        run: |
          mkdir -p reports
          if git fetch --depth=1 origin gh-pages:gh-pages 2>/dev/null; then
            git archive gh-pages | tar -x -C reports || true
          fi
          echo "已有存档：$(ls reports | wc -l) 个文件"

      - name: 生成并推送到微信
        env:
          BRIEF_PROFILE: cloud
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          SCT_SENDKEY: ${{ secrets.SCT_SENDKEY }}
          BRIEF_PAGE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: python -m app.pipeline --push

      - name: 备份存档
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: brief-${{ github.run_number }}
          path: reports/
          retention-days: 14

      - name: 发布到 GitHub Pages
        if: success()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./reports
          publish_branch: gh-pages
          user_name: github-actions[bot]
          user_email: github-actions[bot]@users.noreply.github.com
